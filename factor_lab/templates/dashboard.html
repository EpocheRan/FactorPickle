<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factor Lab · 研究记录</title>
<style>
  :root{
    --paper:#f4efe5; --paper2:#fffdf8; --ink:#211b17; --muted:#74685d;
    --line:#d8cdbd; --line2:#b9a88f;
    --accent:#7b1e2b; --accent2:#a33a45; --accent-soft:#f3e3e3;
    --gold:#a67c3d; --gold-soft:#f4ead9;
    --green:#2e6a4f; --green-soft:#e6f0e9;
    --amber:#a8641a; --amber-soft:#f7ead8;
    --red:#a22a2a; --red-soft:#f7e2e0;
    --slate:#4d6478;
    --mono:"Cascadia Code","JetBrains Mono",Consolas,monospace;
    --sans:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",Georgia,serif;
    --shadow:0 10px 30px rgba(52,38,24,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1000px 500px at 85% -10%,rgba(166,124,61,.10),transparent 60%),linear-gradient(180deg,#f8f4ec 0%,#f2ece1 100%);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
  .wrap{max-width:1440px;margin:0 auto;padding:22px 26px 56px}
  .top{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:18px}
  .brand{font-family:var(--serif);font-size:29px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .brand span{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--gold);margin-left:10px;text-transform:uppercase}
  .meta{margin-left:auto;display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.03em}
  .meta b{color:var(--ink);font-weight:600}
  .health{display:flex;align-items:center;gap:9px;margin:0 0 14px;font-size:11px;color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(168,100,26,.12)}
  .dot.green{background:var(--green);box-shadow:0 0 0 4px rgba(46,106,79,.12)}
  .dot.red{background:var(--red);box-shadow:0 0 0 4px rgba(162,42,42,.12)}
  .section-title{display:flex;align-items:center;gap:12px;margin:0 0 10px}
  .section-title h1{font-family:var(--serif);font-size:22px;letter-spacing:-.02em;margin:0}
  .section-title .sub{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.05em;margin-left:auto}
  .funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:18px}
  .funnel-card{position:relative;background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:15px 16px 14px;box-shadow:var(--shadow);min-width:0}
  .funnel-card:after{content:"→";position:absolute;right:-9px;top:50%;transform:translateY(-50%);z-index:2;background:var(--paper);color:var(--line2);font-family:var(--mono);font-size:14px;line-height:1;padding:2px 2px}
  .funnel-card:last-child:after{display:none}
  .funnel-card .k{font-family:var(--mono);font-size:9px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase}
  .funnel-card .v{font-family:var(--serif);font-size:32px;line-height:1.1;margin:5px 0 2px;color:var(--ink)}
  .funnel-card .n{font-size:10px;color:var(--muted)}
  .panel{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .head h2{font-family:var(--serif);font-size:20px;letter-spacing:-.01em;margin:0}
  .head .sub{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--muted)}
  .filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .filters input,.filters select{font-family:var(--sans);font-size:11px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--paper2);color:var(--ink);outline:none}
  .filters input{min-width:230px;flex:1;max-width:380px}
  .filters input:focus,.filters select:focus{border-color:var(--accent2)}
  .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper2)}
  table{width:100%;border-collapse:collapse;min-width:880px}
  th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:11px;vertical-align:middle}
  th{background:#efe7da;font-family:var(--mono);font-size:8px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;position:sticky;top:0;z-index:1}
  tbody tr{cursor:pointer} tbody tr:hover{background:rgba(166,124,61,.07)} tr:last-child td{border-bottom:none}
  .mono{font-family:var(--mono);font-size:10px}
  .muted{color:var(--muted)}
  .badge{display:inline-block;padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:8.5px;letter-spacing:.03em;white-space:nowrap}
  .badge.pass,.badge.green{background:var(--green-soft);color:var(--green)}
  .badge.warn,.badge.yellow{background:var(--amber-soft);color:var(--amber)}
  .badge.fail,.badge.red{background:var(--red-soft);color:var(--red)}
  .badge.muted{background:#eee7db;color:var(--muted)}
  .badge.gold{background:var(--gold-soft);color:var(--gold)}
  .badge.accent{background:var(--accent-soft);color:var(--accent)}
  .rating{font-family:var(--mono);font-weight:700;font-size:11px}
  .rating.A{color:var(--green)} .rating.B{color:var(--gold)} .rating.C{color:var(--amber)} .rating.D{color:var(--red)} .rating.na{color:var(--muted)}
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:12px;font-family:var(--mono);font-size:9px;color:var(--muted)}
  .pager .info{margin-right:auto}
  .pager button{min-width:27px;height:27px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:6px;cursor:pointer;font:inherit;padding:0 7px}
  .pager button.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .pager button:disabled{opacity:.35;cursor:default}
  .empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}
  .foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:8.5px;color:var(--muted)}
  .overlay{position:fixed;inset:0;background:rgba(34,28,24,.18);z-index:30}
  .overlay[hidden]{display:none}
  .drawer{position:fixed;top:0;right:0;width:min(720px,96vw);height:100vh;overflow:auto;background:var(--paper2);border-left:1px solid var(--line2);box-shadow:-24px 0 60px rgba(34,28,24,.18);z-index:31;padding:22px 24px 44px}
  .drawer[hidden]{display:none}
  .drawer-head{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:15px}
  .drawer-head h3{font-family:var(--serif);font-size:22px;line-height:1.2;margin:0 0 3px}
  .drawer-head .sub{font-family:var(--mono);font-size:9px;color:var(--muted)}
  .drawer-head .x{margin-left:auto;border:0;background:#eee7db;color:var(--ink);width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:17px;line-height:1}
  .metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0 16px}
  .metric{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,253,248,.7)}
  .metric .k{font-family:var(--mono);font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .metric .v{font-size:12px;margin-top:2px}
  .drawer h4{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin:19px 0 8px}
  .chain{display:grid;gap:8px}
  .stage{border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:9px;padding:11px 12px;background:rgba(255,253,248,.7)}
  .stage.used{border-left-color:var(--green)}
  .stage.not_invoked,.stage.derived{border-left-color:var(--gold)}
  .stage .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;font-size:12px}
  .stage .h .prov{font-family:var(--mono);font-size:8px;font-weight:400;color:var(--muted);margin-left:auto}
  .stage .d{font-size:11px;color:var(--ink);margin-top:5px}
  .stage .m{font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:5px;word-break:break-word}
  .hyp{border:1px solid var(--line);border-radius:9px;padding:11px 12px;background:#fbf6ed}
  .hyp .q{font-size:12px}
  .check{display:grid;grid-template-columns:78px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:10.5px}
  .check:last-child{border-bottom:none}
  .check .actual{color:var(--muted)}
  .coverage{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .coverage .box{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:10.5px}
  .coverage .box .k{font-family:var(--mono);font-size:8px;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
  .sources{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
  .source{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:#fbf6ed;font-size:10px}
  .source b{font-size:10px;color:var(--ink)}
  .source span{font-family:var(--mono);font-size:8px;color:var(--muted)}
  @media(max-width:1100px){.funnel{grid-template-columns:repeat(3,1fr)}.funnel-card:nth-child(3):after{display:none}.metric-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:680px){.wrap{padding:14px}.funnel{grid-template-columns:1fr 1fr}.funnel-card:after{display:none}.meta{margin-left:0}.coverage{grid-template-columns:1fr}.drawer{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Factor Lab <span>Research Log</span></div>
    <div class="meta">
      <span>更新 <b id="m-updated">—</b></span>
      <span>策略 <b id="m-policy">—</b></span>
      <span>账本 <b id="m-ledger">—</b></span>
      <span>提交 <b id="m-commit">—</b></span>
    </div>
  </header>

  <div class="health" id="health"><span class="dot" id="health-dot"></span><span id="health-text">—</span></div>

  <div class="section-title">
    <h1>研究漏斗</h1>
    <span class="sub">假设 → 因子 → 实验 → 评估 → 决策</span>
  </div>
  <section class="funnel" id="funnel"></section>

  <section class="panel">
    <div class="head">
      <h2>实验记录</h2>
      <span class="sub" id="table-count">—</span>
    </div>
    <div class="filters">
      <input id="q" type="search" placeholder="搜索实验 / 因子 / 假设" />
      <select id="f-grade">
        <option value="">全部评级</option>
        <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option>
      </select>
      <select id="f-decision">
        <option value="">全部决策</option>
        <option value="park">park</option><option value="iterate">iterate</option><option value="promote">promote</option>
      </select>
      <select id="f-audit">
        <option value="">全部审计</option>
        <option value="pass">通过</option><option value="warn">警告</option><option value="fail">失败</option>
      </select>
      <button id="reset" style="border:1px solid var(--line);background:var(--paper2);border-radius:7px;padding:7px 10px;font-size:11px;cursor:pointer;color:var(--muted)">重置</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>实验</th><th>因子</th><th>评级</th><th>IC</th><th>净价差/期</th><th>换手</th><th>审计</th><th>状态</th><th>日期</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </section>

  <div class="foot">
    <span>Factor Lab · 研究记录</span>
    <span>实验 <b id="m-exp">—</b></span>
    <span>账本记录 <b id="m-records">—</b></span>
    <span>只读</span>
  </div>
</div>

<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <button class="x" id="drawer-close" aria-label="关闭" style="border:0;background:#eee7db;width:30px;height:30px;border-radius:50%;float:right;cursor:pointer;font-size:17px">×</button>
  <div id="drawer-body"></div>
</aside>

<script type="application/json" id="lab-data">__LAB_DATA__</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('lab-data').textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = (v, d=3) => (v === null || v === undefined || Number.isNaN(Number(v))) ? '—' : Number(v).toFixed(d);
  const pct = (v, d=2) => (v === null || v === undefined || Number.isNaN(Number(v))) ? '—' : (Number(v) * 100).toFixed(d) + '%';
  const badge = (v, cls) => `<span class="badge ${esc(cls || v || 'muted')}">${esc(v || '—')}</span>`;
  const ratingBadge = (exp) => exp.grade ? `<span class="rating ${esc(exp.grade)}">${esc(exp.grade)} <small>${fmt(exp.score,1)}</small></span>` : '<span class="rating na">—</span>';
  const PAGE_SIZE = 10;
  const state = { page: 1, q: '', grade: '', decision: '', audit: '' };

  function renderMeta(){
    $('m-updated').textContent = DATA.meta?.generated_at || '—';
    $('m-policy').textContent = DATA.meta?.policy_version || '—';
    $('m-ledger').textContent = DATA.meta?.ledger_head ? String(DATA.meta.ledger_head).slice(0, 10) : '—';
    $('m-commit').textContent = DATA.meta?.git_commit || '—';
    const h = DATA.health || {};
    $('health-dot').className = 'dot ' + (h.level === 'green' ? 'green' : h.level === 'red' ? 'red' : '');
    $('health-text').textContent = (h.reasons || []).join(' · ') || '运行正常';
    $('m-exp').textContent = DATA.meta?.experiment_count ?? (DATA.experiments || []).length;
    $('m-records').textContent = DATA.ledger?.records ?? '—';
  }

  function renderFunnel(){
    $('funnel').innerHTML = (DATA.research_funnel || []).map((s, i) => `
      <div class="funnel-card">
        <div class="k">0${i+1} · ${esc(s.stage)}</div>
        <div class="v">${esc(s.count)}</div>
        <div class="n">${esc(s.note)}</div>
      </div>`).join('') || '<div class="empty">还没有研究记录</div>';
  }

  function filtered(){
    const q = state.q.trim().toLowerCase();
    return (DATA.experiments || []).filter(e => {
      const hay = [e.id,e.factor,e.hypothesis_id,e.bet].join(' ').toLowerCase();
      if (q && !hay.includes(q)) return false;
      if (state.grade && String(e.grade || '').toUpperCase() !== state.grade) return false;
      if (state.decision && String(e.decision || '') !== state.decision) return false;
      if (state.audit && String(e.verdict || '') !== state.audit) return false;
      return true;
    });
  }

  function renderTable(){
    const rows = filtered();
    const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    state.page = Math.min(Math.max(1, state.page), pages);
    const start = (state.page - 1) * PAGE_SIZE;
    const pageRows = rows.slice(start, start + PAGE_SIZE);
    $('table-count').textContent = `共 ${rows.length} 条 / 全部 ${(DATA.experiments||[]).length} 条`;
    $('tbody').innerHTML = pageRows.length ? pageRows.map(e => `
      <tr data-id="${esc(e.id)}">
        <td class="mono">${esc(e.id)}<div class="muted">${esc((e.started_at || '').slice(0,10))}</div></td>
        <td><b>${esc(e.factor)}</b><div class="muted">h=${esc(e.horizon)} · ${esc(e.universe || '—')}</div></td>
        <td>${ratingBadge(e)}</td>
        <td class="mono">${fmt(e.ic,3)}</td>
        <td class="mono">${pct(e.net)}</td>
        <td class="mono">${pct(e.turnover)}</td>
        <td>${badge(e.verdict, e.verdict === 'fail' ? 'fail' : e.verdict === 'pass' ? 'pass' : 'warn')}</td>
        <td>${badge(e.evaluation_status || 'draft', e.evaluation_status === 'candidate' || e.evaluation_status === 'promoted' ? 'pass' : e.evaluation_status === 'parked' || e.evaluation_status === 'failed' ? 'fail' : 'gold')}</td>
        <td class="mono">${esc((e.started_at || '').slice(0,10))}</td>
      </tr>`).join('') : '<tr><td colspan="9"><div class="empty">没有匹配当前筛选的实验</div></td></tr>';
    renderPager(rows.length, pages);
    document.querySelectorAll('#tbody tr[data-id]').forEach(tr => tr.addEventListener('click', () => openDrawer(tr.dataset.id)));
  }

  function renderPager(total, pages){
    if (!total) { $('pager').innerHTML = ''; return; }
    let buttons = '';
    for (let p = 1; p <= pages; p++) {
      buttons += `<button data-page="${p}" class="${p === state.page ? 'active' : ''}">${p}</button>`;
    }
    $('pager').innerHTML = `<span class="info">第 ${state.page} / ${pages} 页</span>
      <button data-page="${state.page - 1}" ${state.page <= 1 ? 'disabled' : ''}>上一页</button>
      ${buttons}
      <button data-page="${state.page + 1}" ${state.page >= pages ? 'disabled' : ''}>下一页</button>`;
    document.querySelectorAll('#pager button[data-page]').forEach(btn => btn.addEventListener('click', () => {
      state.page = Number(btn.dataset.page);
      renderTable();
    }));
  }

  function stageHtml(st){
    const status = String(st.status || '');
    const cls = status === 'used' ? 'used' : (status === 'not_invoked' || status === 'derived') ? status : '';
    return `<div class="stage ${cls}">
      <div class="h"><span class="badge gold">${esc(st.role || 'Agent')}</span>${esc(status || '')}<span class="prov">${esc(st.provenance || '')}</span></div>
      <div class="d">${esc(st.thought || '')}</div>
      ${st.artifact ? `<div class="m">artifact: ${esc(st.artifact)}</div>` : ''}
      ${st.tests ? `<div class="m">tests: ${esc(st.tests)}</div>` : ''}
      ${st.data_path ? `<div class="m">data_path: ${esc(st.data_path)} · codes: ${esc(st.codes)} · rows: ${esc(st.rows)}</div>` : ''}
      ${st.rating ? `<div class="m">rating: ${esc(st.rating)} · decision: ${esc(st.decision || '')}</div>` : ''}
    </div>`;
  }

  function openDrawer(id){
    const e = (DATA.experiments || []).find(x => x.id === id);
    if (!e) return;
    const trace = e.agent_trace || {};
    const input = trace.input || {};
    const checks = (e.detail?.audit_checks || []);
    const dm = e.data_manifest || {};
    const dim = dm.data_interface_manifest || {};
    const dq = e.detail?.report?.data_quality || {};
    $('drawer-body').innerHTML = `
      <div class="drawer-head">
        <div><h3>${esc(e.factor)}</h3><div class="sub">${esc(e.id)} · ${esc(e.hypothesis_id || '')} · ${esc(e.started_at || '')}</div></div>
        <div style="margin-left:auto;text-align:right">${ratingBadge(e)}<div class="muted mono" style="font-size:9px;margin-top:4px">${esc(e.decision || '无决策')}</div></div>
      </div>
      <h4>输入 / 假设</h4>
      <div class="hyp">
        <div class="q">${esc(input.question || e.detail?.hypothesis?.mechanism || '未记录研究问题')}</div>
        <div class="mono muted" style="font-size:9px;margin-top:5px">origin: ${esc(input.origin || '—')} · hypothesis: ${esc(input.hypothesis_id || e.hypothesis_id || '—')}</div>
      </div>
      <h4>Agent 链路</h4>
      <div class="chain">${(trace.stages || []).map(stageHtml).join('') || '<div class="empty">该实验没有 agent_trace.json</div>'}</div>
      <h4>指标与评估</h4>
      <div class="metric-grid">
        <div class="metric"><div class="k">评级</div><div class="v">${esc(e.grade || '—')} / ${fmt(e.score,1)}</div></div>
        <div class="metric"><div class="k">IC</div><div class="v">${fmt(e.ic,3)}</div></div>
        <div class="metric"><div class="k">净价差 / 期</div><div class="v">${pct(e.net)}</div></div>
        <div class="metric"><div class="k">换手</div><div class="v">${pct(e.turnover)}</div></div>
        <div class="metric"><div class="k">审计</div><div class="v">${esc(e.verdict || '—')} / G3 ${esc(e.g3 || '—')}</div></div>
        <div class="metric"><div class="k">状态</div><div class="v">${esc(e.evaluation_status || 'draft')}</div></div>
        <div class="metric"><div class="k">持有期</div><div class="v">${esc(e.horizon)} 日</div></div>
        <div class="metric"><div class="k">股票池</div><div class="v">${esc(e.universe || '—')}</div></div>
      </div>
      <h4>审计检查</h4>
      <div>${checks.length ? checks.map(c => `<div class="check"><span>${badge(c.status, c.status === 'fail' ? 'fail' : c.status === 'warn' ? 'warn' : 'pass')} ${esc(c.check_id)}</span><span class="actual">${esc(c.actual || '')}${c.expected ? ' · 期望 ' + esc(c.expected) : ''}</span></div>`).join('') : '<div class="empty">无审计检查</div>'}</div>
      <h4>数据覆盖</h4>
      <div class="sources">${(e.data_sources || []).map(s => `<span class="source"><b>${esc(s.label)}</b><span>${esc((s.fields || []).join(', ') || (s.services || []).join(', ') || '—')}</span></span>`).join('') || '<span class="muted" style="font-size:10px">未标注来源分类</span>'}</div>
      <div class="coverage">
        <div class="box"><div class="k">data_path</div>${esc(dm.data_path || '—')}</div>
        <div class="box"><div class="k">codes</div>${esc((dim.codes || []).length)}</div>
        <div class="box"><div class="k">rows</div>${esc(dim.rows || '—')}</div>
        <div class="box"><div class="k">services</div>${esc((dim.services || []).join(', ') || dq.universe || '—')}</div>
        <div class="box"><div class="k">开始</div>${esc((dm.start || e.detail?.hypothesis?.start || '—'))}</div>
        <div class="box"><div class="k">结束</div>${esc((dm.end || e.detail?.hypothesis?.end || '—'))}</div>
      </div>
      <h4>结论</h4>
      <div class="hyp"><div class="q">${esc(trace.verdict || e.recommend || '—')}</div><div class="muted mono" style="font-size:9px;margin-top:5px">gate: ${esc(e.gate || '—')} · audit: ${esc(e.verdict || '—')}</div></div>
    `;
    $('overlay').hidden = false;
    $('drawer').hidden = false;
  }
  function closeDrawer(){ $('overlay').hidden = true; $('drawer').hidden = true; }

  function bindFilters(){
    $('q').addEventListener('input', e => { state.q = e.target.value; state.page = 1; renderTable(); });
    ['f-grade','f-decision','f-audit'].forEach(id => {
      $(id).addEventListener('change', e => {
        state[id === 'f-grade' ? 'grade' : id === 'f-decision' ? 'decision' : 'audit'] = e.target.value;
        state.page = 1; renderTable();
      });
    });
    $('reset').addEventListener('click', () => {
      state.q = ''; state.grade = ''; state.decision = ''; state.audit = ''; state.page = 1;
      $('q').value = ''; $('f-grade').value = ''; $('f-decision').value = ''; $('f-audit').value = '';
      renderTable();
    });
    $('drawer-close').addEventListener('click', closeDrawer);
    $('overlay').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  }

  renderMeta(); renderFunnel(); bindFilters(); renderTable();
})();
</script>
</body>
</html>
