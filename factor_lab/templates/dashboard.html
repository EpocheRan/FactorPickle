<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factor Lab · 因子实验室控制台</title>
<style>
  :root{
    --paper:#f6f1e7; --paper2:#fffdf8; --ink:#221c18; --muted:#6d6258;
    --line:#d9cfc0; --line2:#b9ab97;
    --burgundy:#7b1e2b; --burgundy2:#a33a45; --burgundy-soft:#f3e4e4;
    --gold:#a67c3d; --gold-soft:#f4ead9;
    --green:#2e6a4f; --green-soft:#e6f0e9;
    --amber:#a8641a; --amber-soft:#f7ead8;
    --red:#a22a2a; --red-soft:#f7e2e0;
    --slate:#4d6478;
    --mono:"Cascadia Code","JetBrains Mono",Consolas,monospace;
    --sans:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
    --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","SimSun",Georgia,serif;
    --shadow:0 10px 30px rgba(52,38,24,.06);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;
    background:
      radial-gradient(1000px 500px at 85% -10%, rgba(166,124,61,.10), transparent 60%),
      linear-gradient(180deg,#f8f4ec 0%,#f3ede2 100%);
  }
  a{color:var(--burgundy);text-decoration:none}
  .wrap{max-width:1440px;margin:0 auto;padding:22px 26px 60px}
  .top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:1px solid rgba(185,171,151,.4);padding-bottom:14px;margin-bottom:22px}
  .brand{font-family:var(--serif);font-size:25px;font-weight:700;letter-spacing:-.02em}
  .brand span{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--gold);margin-left:10px;vertical-align:middle}
  .top-meta{margin-left:auto;display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.04em}
  .top-meta b{color:var(--ink);font-weight:600}
  .hero{display:grid;grid-template-columns:1.4fr .6fr;gap:16px;margin-bottom:16px}
  .hero-card{background:rgba(255,253,248,.86);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow)}
  .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:var(--gold);font-weight:700}
  .status-line{display:flex;align-items:center;gap:10px;margin:7px 0 4px}
  .status-dot{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(166,124,61,.12)}
  .status-dot.green{background:var(--green);box-shadow:0 0 0 5px rgba(46,106,79,.12)}
  .status-dot.yellow{background:var(--amber);box-shadow:0 0 0 5px rgba(168,100,26,.13)}
  .status-dot.red{background:var(--red);box-shadow:0 0 0 5px rgba(162,42,42,.12)}
  .status-line h1{font-family:var(--serif);font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:0}
  .status-reason{margin:4px 0 0;color:var(--muted);font-size:12.5px;max-width:760px}
  .hero-side{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mini-stat{padding:14px;border:1px solid var(--line);border-radius:12px;background:rgba(255,253,248,.7)}
  .mini-stat b{display:block;font-family:var(--serif);font-size:24px;line-height:1.1;color:var(--burgundy)}
  .mini-stat span{display:block;margin-top:3px;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px}
  .kpi{background:rgba(255,253,248,.86);border:1px solid var(--line);border-radius:12px;padding:14px 15px;box-shadow:var(--shadow)}
  .kpi .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;color:var(--muted);text-transform:uppercase}
  .kpi .v{font-family:var(--serif);font-size:25px;line-height:1.15;margin:5px 0 2px;color:var(--ink)}
  .kpi .s{font-size:10.5px;color:var(--muted)}
  .kpi .v.ok{color:var(--green)} .kpi .v.warn{color:var(--amber)} .kpi .v.bad{color:var(--red)}
  .grid{display:grid;grid-template-columns:2.15fr .85fr;gap:14px;margin-bottom:14px}
  .grid3{display:grid;grid-template-columns:1.1fr 1fr .9fr;gap:14px;margin-bottom:14px}
  .grid2{display:grid;grid-template-columns:1.4fr .6fr;gap:14px;margin-bottom:14px}
  .panel{background:rgba(255,253,248,.86);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
  .panel-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .panel h2{font-family:var(--serif);font-size:18px;letter-spacing:-.01em;margin:0}
  .panel-head .sub{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.04em}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .filters input,.filters select{
    font-family:var(--sans);font-size:11px;padding:6px 8px;border:1px solid var(--line);
    border-radius:7px;background:var(--paper2);color:var(--ink);outline:none;
  }
  .filters input:focus,.filters select:focus{border-color:var(--burgundy2)}
  .table-wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px;background:var(--paper2)}
  table{width:100%;border-collapse:collapse;min-width:900px}
  th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:11px;vertical-align:top}
  th{background:#efe7da;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;position:sticky;top:0;z-index:2}
  tbody tr{cursor:pointer} tbody tr:hover{background:rgba(166,124,61,.06)}
  tr:last-child td{border-bottom:none}
  .mono{font-family:var(--mono);font-size:10.5px}
  .muted{color:var(--muted)}
  .badge{display:inline-block;padding:2px 6px;border-radius:4px;font-family:var(--mono);font-size:8.5px;letter-spacing:.04em;white-space:nowrap}
  .badge.pass,.badge.green{background:var(--green-soft);color:var(--green)}
  .badge.warn,.badge.boundary,.badge.yellow{background:var(--amber-soft);color:var(--amber)}
  .badge.fail,.badge.red{background:var(--red-soft);color:var(--red)}
  .badge.pending,.badge.muted{background:#eee7db;color:var(--muted)}
  .badge.burgundy{background:var(--burgundy-soft);color:var(--burgundy)}
  .badge.gold{background:var(--gold-soft);color:var(--gold)}
  .stack{display:grid;gap:8px}
  .att{padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper2);cursor:pointer}
  .att:hover{border-color:var(--line2)}
  .att .h{display:flex;gap:7px;align-items:center;font-weight:600;font-size:11.5px}
  .att .d{font-size:10.5px;color:var(--muted);margin-top:2px}
  .att.red{border-left:3px solid var(--red)} .att.yellow{border-left:3px solid var(--amber)}
  .bar-row{display:grid;grid-template-columns:42px 1fr 44px;gap:8px;align-items:center;margin:7px 0;font-size:10.5px}
  .bar{height:8px;border-radius:999px;background:#eee7db;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:var(--burgundy2)}
  .bar-row .n{text-align:right;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
  .empty{padding:18px;text-align:center;color:var(--muted);font-size:11.5px;border:1px dashed var(--line2);border-radius:9px}
  .chart{width:100%;height:170px;display:block}
  .chart text{font-family:var(--mono);font-size:8px;fill:var(--muted)}
  .bets{display:grid;gap:8px}
  .bet{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--paper2)}
  .bet .t{display:flex;gap:8px;align-items:center}
  .bet .t b{font-size:11.5px} .bet .t span{margin-left:auto}
  .bet .m{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px;font-size:9.5px;color:var(--muted)}
  .bet .m b{display:block;font-family:var(--mono);font-size:11px;color:var(--ink)}
  .finding{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:10.5px}
  .finding:last-child{border-bottom:none}
  .finding .id{font-family:var(--mono);font-size:9px;color:var(--muted);min-width:82px}
  .finding .d{color:var(--muted)}
  .storage-row{display:grid;grid-template-columns:130px 1fr 74px;gap:8px;align-items:center;margin:6px 0;font-size:10px}
  .storage-row .n{text-align:right;font-family:var(--mono);font-size:9px;color:var(--muted)}
  .drawer{position:fixed;top:0;right:0;width:min(560px,96vw);height:100vh;background:var(--paper2);border-left:1px solid var(--line2);box-shadow:-24px 0 60px rgba(34,28,24,.18);z-index:60;transform:translateX(0);overflow:auto;padding:20px 22px 40px}
  .drawer[hidden]{display:none}
  .drawer-head{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
  .drawer-head h3{font-family:var(--serif);font-size:21px;line-height:1.2;margin:0}
  .drawer-head .x{margin-left:auto;border:0;background:#eee7db;color:var(--ink);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px}
  .drawer h4{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin:18px 0 7px}
  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .metric{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:rgba(255,253,248,.7)}
  .metric .k{font-family:var(--mono);font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .metric .v{font-size:12px;margin-top:1px}
  .check{display:grid;grid-template-columns:92px 1fr;gap:7px;padding:6px 0;border-bottom:1px solid var(--line);font-size:10.5px}
  .check:last-child{border-bottom:none}
  .check .id{font-family:var(--mono);font-size:8.5px;color:var(--muted)}
  .check .a{color:var(--muted)}
  .paths{display:grid;gap:5px;font-family:var(--mono);font-size:9px;color:var(--muted);word-break:break-all}
  .overlay{position:fixed;inset:0;background:rgba(34,28,24,.18);z-index:55}
  .overlay[hidden]{display:none}
  .foot{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:8.5px;color:var(--muted)}
  @media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.grid,.grid3,.grid2,.hero{grid-template-columns:1fr}.hero-side{grid-template-columns:repeat(4,1fr)}}
  @media (max-width:680px){.wrap{padding:14px}.kpis{grid-template-columns:1fr 1fr}.hero-side{grid-template-columns:1fr 1fr}.top-meta{margin-left:0}.drawer{width:100vw}}
  @media print{.top,.filters,.overlay,.drawer{display:none!important}.panel,.kpi{box-shadow:none;break-inside:avoid}.table-wrap{max-height:none;overflow:visible}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Factor Lab <span>控制台</span></div>
    <div class="top-meta">
      <span>更新 <b>__GENERATED_AT__</b></span>
      <span>策略 <b id="m-policy">—</b></span>
      <span>账本 <b id="m-ledger">—</b></span>
      <span>心跳 <b id="m-heartbeat">—</b></span>
      <span>周期 <b id="m-cycle">—</b></span>
      <span>提交 <b id="m-commit">—</b></span>
    </div>
  </header>

  <section class="hero">
    <div class="hero-card">
      <div class="eyebrow">实验室状态</div>
      <div class="status-line"><span id="status-dot" class="status-dot"></span><h1 id="status-label">—</h1></div>
      <p class="status-reason" id="status-reason"></p>
    </div>
    <div class="hero-side" id="hero-side"></div>
  </section>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="panel">
      <div class="panel-head">
        <h2>实验记录</h2>
        <span class="sub" id="table-count">—</span>
      </div>
      <div class="filters">
        <input id="q" type="search" placeholder="搜索因子 / 编号 / 押注" />
        <select id="f-status"><option value="">全部审计状态</option><option value="pass">通过</option><option value="warn">警告</option><option value="fail">失败</option><option value="pending">待定</option></select>
        <select id="f-g3"><option value="">全部 G3</option><option value="pass">通过</option><option value="warn">边界</option><option value="fail">失败</option><option value="pending">待定</option></select>
        <select id="f-bet"><option value="">全部押注</option></select>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>实验</th><th>因子</th><th>押注</th><th>门禁</th><th>IC</th><th>净价差/5日</th><th>换手</th><th>ρ</th><th>N/q</th><th>审计</th><th>决策</th><th>时间</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
    <aside class="panel">
      <div class="panel-head"><h2>待处理</h2><span class="sub">人工队列</span></div>
      <div class="stack" id="attention"></div>
    </aside>
  </section>

  <section class="grid3">
    <div class="panel">
      <div class="panel-head"><h2>门禁漏斗</h2><span class="sub">P0 计数</span></div>
      <div id="funnel"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>试验累计</h2><span class="sub">账本</span></div>
      <svg class="chart" id="trial-chart" viewBox="0 0 600 170" role="img" aria-label="试验累计"></svg>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>研究押注</h2><span class="sub">组合</span></div>
      <div class="bets" id="bets"></div>
    </div>
  </section>

  <section class="grid2">
    <div class="panel">
      <div class="panel-head"><h2>审计发现</h2><span class="sub" id="finding-count">—</span></div>
      <div id="findings"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>数据覆盖</h2><span class="sub">P0 手工表</span></div>
      <div id="coverage"></div>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>存储与清理</h2><span class="sub" id="storage-total">—</span></div>
    <div id="storage"></div>
  </section>

  <div class="foot">
    <span>Factor Lab v0.1 · 只读控制台</span>
    <span>实验 <b id="m-exp">—</b></span>
    <span>试验 <b id="m-trials">—</b></span>
    <span>控制 <b id="m-control">—</b></span>
  </div>
</div>

<div class="overlay" id="overlay" hidden></div>
<aside class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <div><div class="eyebrow" id="d-eyebrow">实验</div><h3 id="d-title">—</h3></div>
    <button class="x" id="d-close" aria-label="close">×</button>
  </div>
  <div id="d-body"></div>
</aside>

<script type="application/json" id="lab-data">__LAB_DATA__</script>
<script>
(function(){
  const DATA = JSON.parse(document.getElementById('lab-data').textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const LABEL = {
    pass:'通过', warn:'警告', fail:'失败', pending:'待定', green:'绿灯', yellow:'黄灯', red:'红灯',
    running:'运行中', success:'成功', failed:'失败', not_configured:'未配置',
    park:'归档', iterate:'迭代', repair:'修复', promote:'晋升', 'promote to G4':'晋升 G4',
    explore:'探索', exploit:'推进', confirmed:'已确认',
    'G3 pass':'G3 通过', 'G3 boundary':'G3 边界', 'G3 fail':'G3 失败', 'G2 fail':'G2 失败'
  };
  const CHECK = {
    artifacts:'产物齐全', run_id:'run_id 一致', params:'参数与窗口', sample:'样本覆盖',
    ic_recompute:'IC 重算', spread_recompute:'毛价差重算', cost_identity:'成本恒等式',
    monotonicity:'单调性', policy:'策略哈希', ledger_chain:'账本链', orphan_run:'孤儿 run',
    outcome_pre_registered:'预注册口径', g3_tradeability:'G3 交易性', report_diagnostics:'报告诊断',
    rating:'评级字段', turnover:'换手上限', capacity:'容量倍数', cost_sensitivity:'2× 成本', orthogonality:'G0.5 相关性'
  };
  const t = (v) => LABEL[String(v)] || String(v ?? '');
  const checkTitle = (c) => CHECK[c.check_id] || c.title || c.check_id;
  const fmt = (v) => (v === null || v === undefined || Number.isNaN(Number(v))) ? '—' : Number(v).toFixed(3);
  const pct = (v) => (v === null || v === undefined || Number.isNaN(Number(v))) ? '—' : (Number(v) * 100).toFixed(2) + '%';
  const dlabel = (v) => String(v || '').slice(0, 10);
  const zhText = (s) => String(s ?? '')
    .replace(/no fail \(warn only\)/gi, '无失败（仅警告）')
    .replace(/\bfail\b/gi, '失败')
    .replace(/\bwarn\b/gi, '警告')
    .replace(/\bpass\b/gi, '通过')
    .replace(/\bmissing\b/gi, '缺失')
    .replace(/\bexpected\b/gi, '期望')
    .replace(/\bchecks\b/gi, '项检查')
    .replace(/cost net/gi, '成本后净价差')
    .replace(/2x net/gi, '2× 净价差')
    .replace(/2x/gi, '2×')
    .replace(/\b(\d+)x\b/gi, '$1×')
    .replace(/\bn\/a\b/gi, '—');
  const bytes = (n) => { if (!n) return '0 B'; const u=['B','KB','MB','GB','TB']; let i=0; let x=Number(n); while(x>=1024&&i<u.length-1){x/=1024;i++;} return x.toFixed(1)+' '+u[i]; };
  const badge = (v, cls) => `<span class="badge ${esc(cls || v || 'muted')}">${esc(t(v) || '—')}</span>`;

  function statusClass(level){ return level === 'green' ? 'green' : level === 'red' ? 'red' : 'yellow'; }
  function renderHeader(){
    const level = DATA.health?.level || 'yellow';
    $('status-dot').className = 'status-dot ' + statusClass(level);
    $('status-label').textContent = level === 'green' ? '绿灯 · 运行正常' : level === 'red' ? '红灯 · 停止检查' : '黄灯 · 受限运行';
    $('status-reason').textContent = (DATA.health?.reasons || []).join(' · ');
    $('m-policy').textContent = DATA.meta?.policy_version || '—';
    $('m-ledger').textContent = (DATA.meta?.ledger_head || '—').slice(0, 18);
    $('m-heartbeat').textContent = DATA.heartbeat?.host_alive_at ? String(DATA.heartbeat.host_alive_at).slice(11, 19) : '—';
    $('m-cycle').textContent = DATA.cycle?.cycle_id ? `${DATA.cycle.cycle_id} · ${t(DATA.cycle.status || '')}` : '—';
    $('m-commit').textContent = DATA.meta?.git_commit || '—';
    $('m-exp').textContent = DATA.meta?.experiment_count ?? 0;
    $('m-trials').textContent = DATA.ledger?.distinct_trials ?? 0;
    $('m-control').textContent = t(DATA.control?.state || '未配置');
    $('hero-side').innerHTML = [
      ['去重 trial', DATA.ledger?.distinct_trials ?? 0, '账本'],
      ['G3 候选', (DATA.experiments || []).filter(e => e.verdict !== 'fail' && e.g3 !== 'fail').length, '研究'],
      ['待处理', (DATA.attention || []).length, '人工'],
      ['策略版本', DATA.meta?.policy_version || '—', '门禁'],
    ].map(([k,v,s]) => `<div class="mini-stat"><b>${esc(v)}</b><span>${esc(k)} · ${esc(s)}</span></div>`).join('');
  }

  function renderKpis(){
    $('kpis').innerHTML = (DATA.kpis || []).map(k => `<div class="kpi"><div class="k">${esc(k.label)}</div><div class="v ${esc(k.tone || '')}">${esc(k.value)}</div><div class="s">${esc(k.sub)}</div></div>`).join('');
  }

  function renderTable(){
    const q = ($('q').value || '').toLowerCase();
    const status = $('f-status').value;
    const g3 = $('f-g3').value;
    const bet = $('f-bet').value;
    const rows = (DATA.experiments || []).filter(e => {
      const hay = [e.id, e.factor, e.bet, e.hypothesis_id].join(' ').toLowerCase();
      return (!q || hay.includes(q)) && (!status || e.verdict === status) && (!g3 || e.g3 === g3) && (!bet || e.bet === bet);
    });
    $('table-count').textContent = `${rows.length} / ${(DATA.experiments || []).length}`;
    if (!rows.length) { $('tbody').innerHTML = `<tr><td colspan="12"><div class="empty">没有匹配当前筛选的实验</div></td></tr>`; return; }
    $('tbody').innerHTML = rows.map(e => `
      <tr data-id="${esc(e.id)}">
        <td class="mono">${esc(e.id)}</td>
        <td>${esc(e.factor)}<div class="muted mono">${esc(e.horizon)} 天 · ${esc(e.universe)}</div></td>
        <td>${esc(e.bet)}</td>
        <td>${badge(e.gate || e.g3, e.g3 === 'fail' ? 'fail' : e.g3 === 'warn' ? 'warn' : 'pass')}</td>
        <td class="mono">${fmt(e.ic)}<div class="muted mono">t ${fmt(e.ic_t)}</div></td>
        <td class="mono">${pct(e.net)}</td>
        <td class="mono">${e.turnover == null ? '—' : (e.turnover * 100).toFixed(0) + '%'}</td>
        <td class="mono">${e.max_rho == null ? '待算' : Number(e.max_rho).toFixed(2)}</td>
        <td class="mono">${e.n_trials ?? '—'} / ${e.q_value == null ? 'q 待算' : Number(e.q_value).toFixed(2)}</td>
        <td>${badge(e.verdict, e.verdict === 'fail' ? 'fail' : e.verdict === 'warn' ? 'warn' : 'pass')}</td>
        <td>${badge(e.recommend || e.decision || 'pending', e.decision === 'promote' ? 'pass' : e.recommend === 'iterate' ? 'warn' : e.recommend === 'repair' ? 'fail' : 'muted')}</td>
        <td class="mono">${e.age_days == null ? '—' : e.age_days.toFixed(1) + ' 天'}</td>
      </tr>`).join('');
    document.querySelectorAll('#tbody tr[data-id]').forEach(tr => tr.addEventListener('click', () => openDetail(tr.dataset.id)));
  }

  function renderAttention(){
    const items = DATA.attention || [];
    $('attention').innerHTML = items.length ? items.map(a => `<div class="att ${a.level}" ${a.exp_id ? `data-id="${esc(a.exp_id)}"` : ''}><div class="h">${badge(a.level, a.level)} ${esc(a.title)}</div><div class="d">${esc(a.detail)}</div></div>`).join('') : `<div class="empty">当前没有待处理项</div>`;
    document.querySelectorAll('.att[data-id]').forEach(el => el.addEventListener('click', () => openDetail(el.dataset.id)));
  }

  function renderFunnel(){
    const rows = DATA.funnel || [];
    const max = Math.max(1, ...rows.map(r => Number(r.count || 0)));
    $('funnel').innerHTML = rows.map(r => `<div class="bar-row"><span class="mono">${esc(r.gate)}</span><div class="bar"><i style="width:${(Number(r.count||0)/max*100).toFixed(1)}%"></i></div><span class="n">${r.count}</span></div><div class="muted" style="font-size:9px;margin:-3px 0 7px 50px">${esc(r.note||'')}</div>`).join('');
  }

  function renderTrials(){
    const pts = DATA.ledger_points || [];
    const svg = $('trial-chart');
    if (!pts.length) { svg.innerHTML = `<text x="20" y="85">暂无账本数据</text>`; return; }
    const w=600, h=170, padL=36, padR=12, padT=16, padB=26;
    const nMax = Math.max(1, ...pts.map(p => Number(p.n||0)));
    const xs = pts.map((p,i) => padL + (w-padL-padR) * (pts.length === 1 ? 0.5 : i/(pts.length-1)));
    const ys = pts.map(p => h-padB - (h-padT-padB) * Number(p.n||0)/nMax);
    const path = xs.map((x,i)=>`${i?'L':'M'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
    const dots = xs.map((x,i)=>`<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="2.5" fill="#7b1e2b"/>`).join('');
    svg.innerHTML = `<line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="#d9cfc0"/><line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="#d9cfc0"/><path d="${path}" fill="none" stroke="#7b1e2b" stroke-width="2"/>${dots}<text x="${padL}" y="${h-8}">${esc(dlabel(pts[0]?.ts))}</text><text x="${w-padR}" y="${h-8}" text-anchor="end">${esc(dlabel(pts[pts.length-1]?.ts))}</text><text x="6" y="${padT+8}">${nMax}</text>`;
  }

  function renderBets(){
    const bets = DATA.bets || [];
    $('bets').innerHTML = bets.length ? bets.map(b => `<div class="bet"><div class="t"><b>${esc(b.bet)}</b><span>${badge(b.status, b.status === 'confirmed' ? 'pass' : 'gold')}</span></div><div class="m"><div>实验<b>${b.experiments}</b></div><div>试验<b>${b.trials}</b></div><div>G3<b>${b.g3}</b></div></div></div>`).join('') : `<div class="empty">还没有押注</div>`;
  }

  function renderFindings(){
    const items = DATA.audit_findings || [];
    $('finding-count').textContent = `${items.length} findings`;
    $('findings').innerHTML = items.length ? items.map(f => `<div class="finding"><span class="id">${esc(f.exp_id)}</span><span>${badge(f.status, f.status === 'fail' ? 'fail' : 'warn')}</span><span><b>${esc(checkTitle(f))}</b><div class="d">${esc(zhText(f.actual))} · 期望 ${esc(zhText(f.expected))}</div></span></div>`).join('') : `<div class="empty">没有审计警告</div>`;
  }

  function renderCoverage(){
    const rows = DATA.coverage || [];
    $('coverage').innerHTML = rows.length ? `<div class="table-wrap" style="max-height:230px"><table style="min-width:0;width:100%"><thead><tr><th>字段</th><th>起始</th><th>覆盖率</th><th>PIT</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="mono">${esc(r.table)}.${esc(r.field)}</td><td class="mono">${esc(r.start)}</td><td class="mono">${r.coverage == null ? '—' : pct(r.coverage)}</td><td>${badge(r.pit ? '有' : '无', r.pit ? 'pass' : 'warn')}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">未提供 data_coverage.json；P0 先用手工表</div>`;
  }

  function renderStorage(){
    const s = DATA.storage || {};
    $('storage-total').textContent = `${bytes(s.output_bytes)} 输出 · ${bytes(s.panel_cache)} 面板缓存`;
    const rows = s.top || [];
    const max = Math.max(1, ...rows.map(r => Number(r.bytes||0)));
    $('storage').innerHTML = rows.map(r => `<div class="storage-row"><span class="mono">${esc(r.name)}</span><div class="bar"><i style="width:${(Number(r.bytes||0)/max*100).toFixed(1)}%;background:#a67c3d"></i></div><span class="n">${bytes(r.bytes)}</span></div>`).join('') || `<div class="empty">暂无存储快照</div>`;
  }

  function metric(k,v){ return `<div class="metric"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`; }
  function checkRow(c){
    return `<div class="check"><span class="id">${esc(c.check_id)}</span><span>${badge(c.status, c.status === 'fail' ? 'fail' : c.status === 'warn' ? 'warn' : 'pass')} <b>${esc(checkTitle(c))}</b><div class="a">${esc(zhText(c.actual))} · 期望 ${esc(zhText(c.expected))}${c.note ? ' · ' + esc(zhText(c.note)) : ''}</div></span></div>`;
  }

  function openDetail(id){
    const e = (DATA.experiments || []).find(x => x.id === id);
    if (!e) return;
    const d = e.detail || {};
    $('d-eyebrow').textContent = `${e.id} · ${t(e.status)}`;
    $('d-title').textContent = e.factor || e.id;
    const metrics = [
      ['IC', fmt(e.ic)], ['IC t', fmt(e.ic_t)], ['净价差/5日', pct(e.net)], ['换手', e.turnover == null ? '—' : (e.turnover*100).toFixed(0)+'%'],
      ['评级', e.grade || '—'], ['分数', e.score == null ? '—' : Number(e.score).toFixed(1)], ['N 试验', e.n_trials ?? '—'], ['q', e.q_value == null ? '待算' : Number(e.q_value).toFixed(3)],
    ];
    const checks = (d.audit_checks || []).map(checkRow).join('');
    const brief = d.brief || {};
    const paths = d.paths || {};
    $('d-body').innerHTML = `
      <div class="stack" style="grid-template-columns:1fr 1fr;display:grid">${badge(e.verdict, e.verdict)} ${badge('G3 ' + (e.g3||'—'), e.g3)}</div>
      <h4>关键指标</h4><div class="metric-grid">${metrics.map(([k,v])=>metric(k,v)).join('')}</div>
      <h4>决策摘要</h4>
      <div class="metric-grid">${metric('门禁', brief.gate || e.gate || '—')}${metric('建议', brief.recommend || '—')}${metric('押注', brief.bet || e.bet)}${metric('试验', (brief.trials && brief.trials.n != null) ? brief.trials.n : (e.n_trials ?? '—'))}</div>
      <div style="margin-top:8px;font-size:12px"><b>风险：</b> ${esc((brief.risks || []).join('；') || '—')}</div>
      <h4>审计检查</h4>${checks || '<div class="empty">还没有审计结果</div>'}
      <h4>产物路径</h4><div class="paths">${Object.entries(paths).map(([k,v])=>`<div>${esc(k)}: ${esc(v)}</div>`).join('') || '<div class="muted">无</div>'}</div>
    `;
    $('drawer').hidden = false; $('overlay').hidden = false;
  }
  function closeDetail(){ $('drawer').hidden = true; $('overlay').hidden = true; }

  function initBets(){
    const bets = [...new Set((DATA.experiments || []).map(e => e.bet))];
    $('f-bet').innerHTML = '<option value="">全部押注</option>' + bets.map(b=>`<option>${esc(b)}</option>`).join('');
  }

  $('d-close').addEventListener('click', closeDetail);
  $('overlay').addEventListener('click', closeDetail);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
  ['q','f-status','f-g3','f-bet'].forEach(id => $(id).addEventListener('input', renderTable));
  ['f-status','f-g3','f-bet'].forEach(id => $(id).addEventListener('change', renderTable));

  renderHeader(); renderKpis(); initBets(); renderTable(); renderAttention(); renderFunnel(); renderTrials(); renderBets(); renderFindings(); renderCoverage(); renderStorage();
})();
</script>
</body>
</html>
